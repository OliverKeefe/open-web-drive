name: Go Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: Install dependencies
        run: go mod download

      - name: Run tests
        working-directory: backend
        run: go test ./... -v

      - name: List files for debug
        run: ls -R
